version: '3.8'

services:
  php:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: masterstouchstore
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./masterstouchstore.sql:/docker-entrypoint-initdb.d/masterstouchstore.sql:ro

volumes:
  db_data:
